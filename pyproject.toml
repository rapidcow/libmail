[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "rdks-mail"
version = "0.0.0"
readme = { file = "README", content-type = "text/plain" }
license = { file = "COPYING", content-type = "text/plain" }
requires-python = ">=3.6"
authors = [{name = "Ethan Meng", email = "ethan@rapidcow.org"}]
maintainers = [{name = "Ethan Meng", email = "ethan@rapidcow.org"}]
description = "electronic mail toolkit"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
# XXX: this PROBABLY doesn't work over pip install git+https...
dependencies = [
# "rdks-list==0.0",
]

[project.scripts]
parse-thread-index = "rdks.mail.utils.parse_thread_index:main"
"compose.py" = "rdks.mail.compose:main"

[tool.setuptools.packages.find]
namespaces = true
