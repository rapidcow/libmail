[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "rdks-mail"
version = "0.0.0"
readme = { file = "README", content-type = "text/plain" }
license = { file = "COPYING", content-type = "text/plain" }
requires-python = ">=3.6"
authors = [{name = "Ethan Meng", email = "ethan@rapidcow.org"}]
maintainers = [{name = "Ethan Meng", email = "ethan@rapidcow.org"}]
description = "electronic mail toolkit"
classifiers = [
  "Programming Language :: Python :: 3",
  # might work for these...?
  # "Programming Language :: Python :: 3.8",
  # "Programming Language :: Python :: 3.9",
  # "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = []

[project.optional-dependencies]
tree = ["humanize~=4.9"]
# it's PEP 508!
compose = ["rdks-list@git+https://git.rapidcow.org/rdks-list.git@205fee77c981bd2c3b0e8e3c100d0553aa91983a"]

[project.scripts]
parse-thread-index = "rdks.mail.utils.parse_thread_index:main"
"compose.py" = "rdks.mail.compose:main"
mime-tree = "rdks.mail.utils.mime_tree:main"

[tool.setuptools.packages.find]
namespaces = true
